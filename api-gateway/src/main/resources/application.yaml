server:
  port: 8888

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - http://localhost:3000
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowedCredentials: true

      routes:
        - id: extraction-service
          uri: lb://extraction-service
          predicates:
            - Path=/api/v1/extraction/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
logging:
  level:
    org.springframework.web.reactive.function.client: DEBUG
    reactor.netty.http.client: DEBUG
bank:
  api:
    domain: obiebank-sbx.banfico.io
    tenant: provider
    client-id: corebank-spa
    client-secret: corebank-spa-password