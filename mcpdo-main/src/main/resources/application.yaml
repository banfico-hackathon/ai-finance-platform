spring:
  application:
    name: automated-todo

  datasource:
    url: jdbc:postgresql://localhost:5432/todo_db
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.2
    mcp:
      server:
        name: todo-mcp-server
        version: 1.0.0
        type: SYNC

server:
  port: 8080
