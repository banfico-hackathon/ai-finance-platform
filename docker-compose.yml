services:

  postgres:
    image: postgres:17

    container_name: extraction-postgres

    environment:
      POSTGRES_DB: extraction_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  extraction-service:
    build:
      context: ./extraction-service

    container_name: extraction-service

    ports:
      - "8081:8080"

    depends_on:
      - postgres

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/extraction_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

volumes:
  postgres_data: